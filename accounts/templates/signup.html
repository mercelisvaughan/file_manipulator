{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-[80vh] lg:py-0">
    <div class="w-full bg-white rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 border border-gray-200">
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
            <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl">
                Create an account
            </h1>
            
            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                
                <div class="space-y-4 md:space-y-6 [&>p>input]:bg-gray-50 [&>p>input]:border [&>p>input]:border-gray-300 [&>p>input]:text-gray-900 [&>p>input]:rounded-lg [&>p>input]:focus:ring-blue-600 [&>p>input]:focus:border-blue-600 [&>p>input]:block [&>p>input]:w-full [&>p>input]:p-2.5 [&>p>label]:block [&>p>label]:mb-2 [&>p>label]:text-sm [&>p>label]:font-medium [&>p>label]:text-gray-900 [&>p>div]:text-xs [&>p>div]:text-gray-500">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="w-full mt-6 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                    Create Account
                </button>
                
                <p class="mt-4 text-sm font-light text-gray-500">
                    Already have an account? <a href="{% url 'login' %}" class="font-medium text-blue-600 hover:underline">Login here</a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
