<nav class="bg-white border-b border-gray-200 fixed w-full z-30 top-0 start-0">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
      
      <a href="{% url 'index' %}" class="flex items-center space-x-3 rtl:space-x-reverse">
          <span class="self-center text-2xl font-semibold whitespace-nowrap text-blue-600">PDF Manipulator</span>
      </a>

      <div class="flex items-center space-x-3 md:space-x-4 rtl:space-x-reverse">

        {% if user.is_authenticated %}
          <div class="flex items-center gap-4">
              <span class="text-gray-900 font-medium">
                  Hello, {{ user.username }}
              </span>

              <form method="post" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="text-white bg-red-500 hover:bg-red-600 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-4 py-2 text-center">
                      Sign Out
                  </button>
              </form>
          </div>

        {% else %}
          <div class="flex items-center gap-2">
              <a href="{% url 'login' %}" class="text-gray-900 hover:text-blue-700 font-medium text-sm px-4 py-2">
                  Log In
              </a>

              <a href="{% url 'register' %}" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center">
                  Get Started
              </a>
          </div>
        {% endif %}

      </div>
    </div>
  </nav>
